name: Notify scheduled failures

# Catch-all Slack notifier for scheduled workflow failures. Fires via
# workflow_run on any workflow completion in this repo; the job-level
# if: filters to event==schedule and conclusion==failure. This closes
# the gap where failed nightlies (local reusables, inline sibling jobs,
# legacy per-repo workflows) used to stay silent because they didn't
# call notify-failure.yml directly. One file per repo covers every
# current and future scheduled workflow without per-workflow wiring.
#
# Manual (workflow_dispatch) failures stay quiet by design — the
# operator is already watching when they hit dispatch.

on:
  workflow_run:
    # `**`, NOT `*`. In GitHub's filter-pattern syntax `*` does not match
    # the `/` character, so `["*"]` silently excludes every workflow whose
    # NAME contains a slash. No workflow in this repo has one today, which
    # is exactly why it is worth fixing now: the failure mode is not an
    # error, it is a workflow that is simply never monitored. greentic-e2e
    # lost 17 consecutive nights that way (2026-08-15 .. 2026-09-02) to a
    # workflow called "Nightly e2e gtc install/wizard", while its
    # slash-free siblings alerted normally — which made the gap read as
    # "the nightly is fine" rather than "the nightly is unwatched".
    #
    # The field exists only to silence an actionlint schema warning;
    # omitting `workflows:` entirely also matches everything. Keep `**` so
    # the linter stays quiet AND the catch-all is actually a catch-all.
    workflows: ["**"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Failure
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'failure'
    uses: greenticai/.github/.github/workflows/notify-failure.yml@main
    with:
      workflow-name: ${{ github.event.workflow_run.name }}
      repo: ${{ github.repository }}
      run-url: ${{ github.event.workflow_run.html_url }}
    secrets: inherit

  # Recovery only — NOT every green run. Posting "succeeded" for each would
  # put routine messages into the alert channel every day, and an alert
  # channel people learn to scroll past is worse than no channel. A suite
  # going green again after failing is news; one that was already green is
  # not.
  #
  # Without this, perf goes red loudly and recovers in SILENCE. That is not
  # a cosmetic gap: on 2026-09-05 both perf suites had been fixed and were
  # green by 15:24, and the last thing this channel had said about perf was
  # the previous day's failure — so the question "perf and e2e still broken
  # or already fixed?" had to be asked by hand. Silence that means "fixed"
  # is indistinguishable from silence that means "nobody ran it".
  #
  # The previous conclusion is not in the workflow_run payload, so it is
  # looked up: the most recent COMPLETED scheduled run of the same workflow
  # that is not this one.
  recovery-gate:
    name: Recovery gate
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      recovered: ${{ steps.check.outputs.recovered }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - name: Did the previous scheduled run fail?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          THIS_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # `|| true` so an API hiccup degrades to "no notification" rather
          # than a red run on a workflow that only exists to report.
          previous="$(gh api \
            "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs?event=schedule&status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${THIS_RUN})] | .[0].conclusion // \"none\"" 2>/dev/null || echo "none")"
          echo "previous scheduled conclusion: ${previous}"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          if [ "${previous}" = "failure" ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi

  notify-recovery:
    name: Recovery
    needs: recovery-gate
    if: needs.recovery-gate.outputs.recovered == 'true'
    uses: greenticai/.github/.github/workflows/notify-success.yml@main
    with:
      workflow-name: ${{ github.event.workflow_run.name }}
      details: >-
        Recovered — the previous scheduled run failed.
        ${{ github.repository }} · ${{ github.event.workflow_run.html_url }}
    secrets: inherit
